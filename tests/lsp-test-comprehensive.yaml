      ```Valid macros - No errors expected:```
      | `simple_macro`
      | `macro_with_args(field1, "value")`
      | tstats `security_content_summariesonly` count by host
      | `drop_dm_object_name(Filesystem)`
      | eval time=`security_content_ctime(firstTime)`

